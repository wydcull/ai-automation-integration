spring.application.name=rag-service
server.port=8081

# PostgreSQL + pgvector
spring.datasource.url=jdbc:postgresql://localhost:5432/rag_db
spring.datasource.username=
spring.datasource.password=

# Groq (chat) - same as chatbot
groq.api.base-url=https://api.groq.com/openai/v1
groq.api.key=xxxxx
groq.api.model=openai/gpt-oss-120b
groq.api.temperature=0.3
groq.api.max-tokens=1500

# Embeddings (OpenAI example; Groq has no embedding API)
#openai.api.key=
#embedding.model=text-embedding-3-small
#embedding.dimensions=1536

# Embeddings via Ollama (local, free)
embedding.base-url=http://localhost:11434
embedding.model=nomic-embed-text
embedding.dimensions=768

# RAG tuning
rag.chunk-size=120
rag.chunk-overlap=20
rag.top-k=5
rag.min-similarity-score=0.45

openai.api.base-url=https://api.openai.com/v1
spring.jpa.hibernate.ddl-auto=update

# File upload limits (for PDF documents)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB