spring.application.name=rag-service
server.port=8081

# PostgreSQL + pgvector
spring.datasource.url=jdbc:postgresql://localhost:5432/rag_db
spring.datasource.username=postgres
spring.datasource.password=welcome

# Groq (chat) - same as chatbot
groq.api.base-url=https://api.groq.com/openai/v1
groq.api.key=${GROQ_API_KEY}
groq.api.model=qwen/qwen3.6-27b
groq.api.temperature=0.3
groq.api.max-tokens=1500

# Embeddings (OpenAI example; Groq has no embedding API)
openai.api.key=${OPENAI_API_KEY}
embedding.model=text-embedding-3-small
embedding.dimensions=1536

# RAG tuning
rag.chunk-size=800
rag.chunk-overlap=100
rag.top-k=5
rag.min-similarity-score=0.7

openai.api.base-url=https://api.openai.com/v1
spring.jpa.hibernate.ddl-auto=update