# Server Configuration
server.port=8080

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/Ai_chatbot
spring.datasource.username=postgres
spring.datasource.password=welcome
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Groq Configuration
groq.api.key=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
groq.api.base-url=https://api.groq.com/openai/v1
groq.api.model=qwen/qwen3.6-27b
groq.api.temperature=0.7
groq.api.max-tokens=1000

# ========== ENHANCED LOGGING CONFIGURATION ==========
# Root logging level
logging.level.root=INFO
# Application logging
logging.level.org.wydcull.ai_chatbot_project=INFO
logging.level.org.wydcull.ai_chatbot_project.service=DEBUG
logging.level.org.wydcull.ai_chatbot_project.controller=INFO
logging.level.org.wydcull.ai_chatbot_project.repository=DEBUG

# Spring Framework logging
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.servlet.mvc=DEBUG
logging.level.org.springframework.cache=INFO
logging.level.org.springframework.scheduling=INFO
# Database logging (set to WARN to reduce noise)
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.com.zaxxer.hikari=WARN
# External API logging
logging.level.org.springframework.web.reactive.function.client=DEBUG


# Log pattern for console
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5level) [%thread] %cyan(%logger{36}) - %msg%n

# Log pattern with correlation ID
logging.pattern.level=%5p [${spring.application.name:app},%X{traceId},%X{sessionId}]

# ========== END LOGGING CONFIGURATION ==========
# Cache Configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=10m

# Chat History Management Configuration
chat.history.default-page-size=20
chat.history.max-page-size=100
chat.history.session-ttl-days=30
chat.history.cleanup-retention-days=90
chat.history.summarization-threshold=20
chat.history.enable-auto-cleanup=true

# Enable scheduling for cleanup jobs
spring.task.scheduling.enabled=true
# CORS Configuration - Development
cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://127.0.0.1:3000
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600
# Application name for logging
spring.application.name=ai-chatbot