# Server Configuration
server.port=8080

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/Ai_chatbot
spring.datasource.username=postgres
spring.datasource.password=welcome
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Groq Configuration
groq.api.key=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
groq.api.base-url=https://api.groq.com/openai/v1
groq.api.model=llama-3.3-70b-versatile
groq.api.temperature=0.7
groq.api.max-tokens=1000

# Logging
logging.level.org.wydcull.ai_chatbot_project=DEBUG
logging.level.org.springframework.web=INFO

# Cache Configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=10m

# Chat History Management Configuration
chat.history.default-page-size=20
chat.history.max-page-size=100
chat.history.session-ttl-days=30
chat.history.cleanup-retention-days=90
chat.history.summarization-threshold=20
chat.history.enable-auto-cleanup=true

# Enable scheduling for cleanup jobs
spring.task.scheduling.enabled=true

# CORS Configuration - Development
cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://127.0.0.1:3000
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600
